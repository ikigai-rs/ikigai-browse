[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.71"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-core"
homepage = "https://github.com/ikigai-rs/ikigai-core"
keywords = ["resource", "rdf", "sparql", "cache", "kernel"]
categories = ["caching", "data-structures"]

[workspace.dependencies]
# core RDF foundations come from the Oxigraph crate family
oxrdf = "0.3"
