[package]
name = "ikigai-browse"
description = "Repository browsing as ikigai resources: per-root tree / file / git-state / hash endpoints, an archived LLM explanation layer, W3C Web Annotations that re-anchor under drift, a machine review pass that mints its findings as provenance-distinguished annotations, and a pull-request family (listing, annotatable diff pages, head-commit-keyed explains and reviews) - capability-gated, with text, htmx-HTML, and Turtle faces."
# 0.3.0 — MINOR, and deliberately not a patch: the annotation namespace moved
# from `urn:annotation:` to `urn:iki:annotation:` (the `urn:iki:` migration).
# A module crate's RESOURCE NAMES are its public interface even when its Rust
# API is untouched, so a patch would be picked up by a bare `cargo update` and
# take the old names out from under a host that had not installed an alias.
# The minor bump forces the manifest edit the host's alias rule must ride in:
#     prefix urn:annotation:  urn:iki:annotation:
#     exact  urn:annotation   urn:iki:annotation      # the bare minting IRI
# — BOTH rules; a prefix rule alone does not match the bare `urn:annotation`.
#
# 0.3.1 — PATCH, and deliberately not a minor: it adds the one-shot that moves
# an EXISTING store's annotations into the new namespace (the `migrate` module,
# the gated `migrate-annotation-ns` binary, the rehearsal example). Purely
# additive — no resource name, capability, face or host-facing signature moves,
# and a host that never runs the tool cannot tell 0.3.1 from 0.3.0. The alias
# rule above is what 0.3.0 asked hosts for; this is what it forgot to give them,
# because an alias rewrites incoming NAMES and does nothing to stored data.
#
# 0.3.2 — PATCH, additive: `Mount::space_watched` returns the space AND a
# `StyleWatch`, the watch over the config home that cuts `urn:repo:style`'s
# golden threads when an `a11y.toml` layer is edited or created. `Mount::space`
# is unchanged (it is `space_watched` with the watch dropped), no resource name,
# capability or face moves, and a host that keeps calling `space` keeps the
# behaviour it had — an edit lands at the next restart instead of the next read.
#
# 0.3.2 also adopts `ikigai-conformance` (`tests/conformance.rs`, 40 findings to
# 0). Everything that moved is ADDITIVE to the manifold and invisible to a Rust
# caller: every untyped input gained a `class`, three `as` inputs gained the
# `text/plain` their own `default_value` already named (the enum omitted the
# default), and the annotation Sink DECLARES the `content` it has read as the
# piped form of `body` since the family shipped. A consumer reading the manifold
# sees a truer contract; none sees a narrower one.
#
# 0.4.0 — MINOR, and deliberately not a patch, on three counts.
#
# 1. **Read confinement is an observable change, and it is the whole point.**
#    Before this, every write named `GraphName::DefaultGraph` and every read
#    passed `None` for the graph — which in `quads_for_pattern` means EVERY
#    graph in the store. `Mount::graph` / `ExplainConfig::graph` move both, and
#    the DEFAULT case moves with them: a mount that names no graph now reads the
#    default graph rather than the whole dataset. For a store browse is the only
#    writer of, those two are the same answer and nothing changes. For a SHARED
#    store they are not, and browse will stop returning quads someone else put
#    in a named graph — which is the tenancy hole being closed, not a regression,
#    but it is a behaviour change and a patch would carry it in unannounced.
# 2. `migrate::Counts` gains `total` and `outside_target_graph` (and
#    `#[non_exhaustive]`, so this is the last such flag day): adding a public
#    field to a struct with public fields is a breaking change, whatever the
#    fields mean.
# 3. ★ **A host must be able to decide, and a minor forces the manifest edit
#    where the decision gets made.** Naming a graph is not free: a host sharing
#    one dataset between browse and a graph-scoped store may be relying on
#    browse being invisible to scoped reads in order to call them cacheable
#    (`ikigai-gonk`'s `freshness` module does exactly this, and measures ~1000x
#    on the ledger's hot read). The default stays `GraphName::DefaultGraph` so
#    that nothing changes until someone asks — and the bump is what puts the ask
#    in front of them. Same argument 0.3.0 made for the namespace rename.
#
# Additive beside that: `migrate::plan_into_graph` / `plan_with` /
# `counts_for_graph` / `BROWSE_SUBJECT_PREFIXES`, and `--graph <iri>` on the
# `migrate-annotation-ns` binary — the one-shot an existing store needs before
# a host's `Mount::graph` can see its data (the failure mode of skipping it is
# silent, exactly as it was for the namespace rename).
#
# 0.4.1 — PATCH, additive, and deliberately not a minor: the cross-store root
# move (`migrate::plan_transfer` and friends, the `migrate-archive-roots`
# binary, the `root-migration-rehearsal` example). Nothing a host calls changes
# shape — no resource name, capability, face or existing signature moves, and a
# host that never runs the tool cannot tell 0.4.1 from 0.4.0. It answers a
# question 0.4.0's `--graph` did not: an archive is keyed
# `(repo, path, content-hash, version-tag)` and stays valid wherever it lives,
# but `repo` is a ROOT NAME, and two hosts can name the same directory
# differently. Carrying an archive between them is a rename in four IRI
# positions plus one literal, and getting it partly right produces a store that
# is present, countable and answered by nothing — the same silent shape as the
# namespace rename and the graph move, for the third time.
#
# ⚠ It also CORRECTS a claim: `migrate`'s module doc, both binaries and the
# README said there was no writing verb in the ecosystem's SPARQL surface and
# that the migration binary should be deleted when one arrived. One arrived —
# `urn:sparql:update` (ikigai-sparql) and `urn:iki:store:update` /
# `urn:iki:store:graph-update` (ikigai-store). The in-place moves are now
# expressible as a query against a host binding one of those; the cross-store
# one is not, and says why in one place rather than four.
# 0.4.2 was PURELY ADDITIVE and the number was chosen deliberately: `review` gained
# `provider=` (#32), the file face gained a Review button and
# `urn:repo:{repo}:review-options:{path}` (#33), and the layout CSS became
# `urn:repo:style:layout` (#34). Nothing moved or changed shape. That entry argued
# AGAINST 0.5.0 on caret-ceiling grounds, and it was right for that release.
#
# 0.5.0 (#36, ledger #444) IS a break, so the same reasoning now points the other
# way. `urn:repo:{repo}:review:{path}` no longer produces annotations — it produces
# PENDING findings, and promotion by a human is the only path into the
# `urn:iki:annotation:` family ("nothing gets published to Gonk except by the
# human"). Its `requires` SHRANK with it: the review actions no longer declare
# `urn:cap:annotate`, because they no longer write annotations, and declaring a cap
# you do not enforce makes the manifold lie. A caller that expected annotations to
# appear gets findings instead. That is a changed shape, and under 0.x it is a minor.
#
# ⚠ SO GONK'S PIN MOVES IN THE SAME WAVE, AND THIS IS NOT OPTIONAL. `ikigai-gonk`
# pinned `ikigai-browse = "0.4.2"`, and `^0.4.2` means `<0.5.0` — publishing that
# without moving the pin would have ceilinged gonk out of the exact change it was
# waiting for, silently, with no diagnostic. Rule 5's second half; the
# ikigai-dev-server 0.10 pin is the precedent that cost two minor releases before
# anyone noticed. The pin moved with the publish (gonk #24), and had to AGAIN for
# 0.6.0, because `^0.5.0` means `<0.6.0` — the same trap, one release later. gonk
# now pins "0.6.0", and `^0.6.0` admits every 0.6.x, which is exactly why 0.6.1 is
# a PATCH: calling it a minor would drag gonk's pin into the wave for a change gonk
# cannot otherwise observe. ⚠ Two consumers ARE ceilinged out and this bump does not
# fix them: ikigai-cli pins "0.5.0" (`<0.6.0`) and ikigai-dev-server pins "0.3.0"
# (`<0.4.0`). Neither will see this anchor fix until its pin moves.
#
# 0.6.1 carries ONE behavioural change and two things that are not API.
#
# #42 (ledger #488): a quote the model DECORATED with the document's own marker —
# a leading `⚠` or `**` the line does not carry — now anchors, by ONE retry with
# the leading run of non-alphanumerics stripped (`annotate::strip_leading_decoration`,
# `find_anchor_on_file`). Measured on the field guide: orphan rate 32.2% → 17.2%,
# as two anchoring functions over ONE set of raw answers, so model variance is
# excluded. ★ Why this is a patch and not a minor: no resource name, capability,
# face or signature moves, and NOTHING STORED CHANGES — an orphaned quote minted
# nothing, so there is no existing finding whose id (`sha256(pass ‖ char_start ‖
# exact)`) could move. What changes is that findings which used to be silently
# dropped now exist. The stored `exact` is the STRIPPED form, read back out of the
# file, never the model's decorated string — so the same finding is the same id on
# every pass. Deliberately NOT wrap tolerance: 9 of the 15 residual orphans are a
# hard-line-wrap shape and would anchor under a looser match, but that is a bigger
# concession than a leading strip and the kind of loosening that erodes what the
# anchor proves. The 6 genuine misquotations SHOULD orphan.
# #41 (ledger #483) added no code the pass runs: two prompt lines were measured and
# both failed, so the prompt is unchanged and `review-v5` stands — the pass tag does
# not move. It added a test that asserts the ABSENCE of the losing sentence, and the
# disclosure corpus under tests/corpus/. #43 (ledger #491) gave the probe example a
# `--model` flag. Neither is API.
#
# 0.6.0 carries TWO arcs that both changed the review's observable shape.
#
# review-v4 (#38, ledger #449) replaced the 3-to-6 QUOTA with a threshold. ⚠ The
# consumer-visible part is that a pass can now be archived with ZERO findings and
# a statement saying so — `nothing above threshold · reviewed the whole file
# (4812 bytes)`. **A caller reading `minted.is_empty()` as failure was correct
# before this and is wrong after it**, which is the break that makes this a minor
# rather than a patch. The json face gains `statement`; the plain and html faces
# change shape.
# ★ And the thing worth remembering from that arc: the threshold is deliberately
# NOT keyed on self-reported severity. Measured, the phrasing "report what you
# would rate major or worse" moved the serious share 27% → 62% (→ 91% with
# calibration prose) by RE-LABELLING — 43% of the new "serious" were findings the
# old prompt rated minor or info. A self-reported severity cannot be both the
# triage signal and the reporting gate. A test fails if that sentence returns.
#
# review-v5 (#39, ledger #450) removed TRUNCATION. A file is split into
# line-aligned regions that TILE it — concat reproduces the file byte for byte —
# so `ik:reviewedBytes == ik:totalBytes` stops being a disclosure and becomes an
# invariant a test pins. `PassEntry::truncation_note` became `coverage_note`, and
# the words `(input truncated)` became `(coverage incomplete)`: a short reading now
# means a region that did not come back, not a ceiling. ⚠ `pr.rs` shares that entry
# type and still truncates its diff by policy, so its face understates what it
# knows until the diff review gets the same treatment (ledger #472).
#
# 0.7.0 — MINOR, and deliberately not a patch, for the same reason 0.5.0 and
# 0.6.0 were: a PUBLIC FACE GAINED AN ARGUMENT, and under 0.x that is the bump a
# consumer has to move a pin to see. `urn:repo:{repo}:file:{path}` now declares
# `proposals=` (store mounted): a comma-separated list of the finding contract's
# severity words that draws the file's PENDING review findings of those
# severities beside the lines they anchor to, as proposal marks — labelled
# proposals, never annotations, nothing published, each linking its
# `urn:iki:finding:{id}` (ledger #496: the host narrows its triage queue to
# critical + major, and the rest must stay visible where the code is rather
# than in a backlog). ★ **Default: none.** A consumer that does not pass it
# gets a byte-identical page, and a plain `space()` mount does not declare it —
# so nothing existing moves, and calling this a patch was arguable. It is a
# minor because the argument is the whole point of the release: gonk, which
# pins `"0.6.0"`, is the consumer that will pass it, and `^0.6.0` means `<0.7.0`
# — gonk CANNOT see this face until its pin moves, which is expected and is the
# hub's wave to run (the same trap 0.5.0 and 0.6.0 each moved the pin through).
# A patch would have let gonk's next `cargo update` pull the argument in
# silently, with no manifest edit marking the moment it started passing it.
# Also in 0.7.0, not API: the machine annotation marker's class
# (`browse-annotation-marker-machine`) gained the stylesheet rule it never had —
# it was built as a tuple, not a `class="…"` literal, so the class scan could
# not see it; and the layout palette gained `--browse-praise` /
# `--browse-propose` plus a test that holds every foreground property to the
# a11y contrast floor on white and near-black grounds.
#
# 0.8.0 — MINOR: WHAT A PASS DERIVES AND STORES CHANGED, OBSERVABLY (ledger #481).
# The review archive is keyed twice now. Beside the pass entry (still keyed by
# the file's content hash) every derived region is memoized under the sha256 of
# ITS OWN bytes — `urn:ikigai:browse:review-region:…`, a new IRI family in the
# store — and a pass over a changed file asks the model only about the regions
# whose bytes moved, carrying the unchanged regions' EXISTING finding records
# forward: same ids, same pending/declined state, re-anchored by the one drift
# path. Measured on the ledger's own case (`src/review.rs` a6b0900 → eb77038,
# the 108-line doc-comment commit, qwen3-coder:30b, `examples/review-memo-probe`):
# the pass over the changed file made 4 model calls instead of 12 and minted 15
# findings instead of 61, carrying 59 forward under their existing ids — 9 of
# 13 regions unchanged. Queue growth for that commit: 15, not 61. ★ Why a minor: the json face
# gained fields (`carried`, `memo_regions`, `derived_regions`), `statement`
# gained two clauses, `minted` now means "what THIS pass minted" rather than
# "every finding on file for this reading" (the union is `annotations`), and a
# consumer that counted the pending queue's growth per commit sees a different
# number — which is the whole point, and is not a patch. gonk pins `"0.7.0"`
# and `^0.7.0` is `<0.8.0`, so it cannot see this until its pin moves; that is
# the hub's wave, as for 0.5.0, 0.6.0 and 0.7.0 before it. The tiling now SNAPS
# to remembered regions (`review::tile`): without that, an insertion shifts
# every later cut point and the memo would miss on every region after the
# edit, which on a doc comment near the top is all of them. The prompt and
# the tag (`review-v5`) are UNCHANGED — a memo is not a prompt change, and
# re-keying every pass would defeat it. The root-move migration gained the new
# prefix (`migrate::REGION_PREFIX`) so memos travel with a renamed root. Two
# vocabulary needs are REPORTED, not invented: a class for the memo (it is
# typed `prov:Collection` meanwhile, every term on it already published) and a
# count of carried regions on the pass (derivable from `prov:used` links
# meanwhile). No new capability, no resource name moved, `provider=` and the
# PR pass untouched (a diff pass has no regions).
#
# 0.9.0 — MINOR: A DECLINE IS REMEMBERED (ledger #475). A finding's id carries
# the pass and the pass carries the content hash, so any edit to a file could
# resurface a claim a human had declined, under a new id, presented as new —
# measured 2026-09-22: a prose-only commit to a manifest minted 17 findings, 8
# of them verbatim re-raises of the previous day's declines on lines the commit
# did not touch. Now, at mint time, a fresh finding is checked against the
# DECLINED findings on the same file with the same `exact` (after the anchor's
# own decoration strip): it is minted CARRYING the prior decision — a
# `prov:wasInfluencedBy` link to the declined twin's decision node, and on the
# json row a `prior_decision` object {finding, iri, outcome, severity,
# decided_at, note} — so the second decision is one click and a different claim
# on the same line stays visible; only an EXACT repeat (same quote, same
# proposed severity, byte-identical note) is withheld, and every withheld one
# is counted (`suppressed_items` on the pass's json face, `ik:suppressedItems`
# in its graph, "(N withheld as exact repeats)" in its statement). ★ Why a
# minor: the finding's faces gained a field, the pass's faces gained a count
# and a statement clause, a pass whose every item was withheld is now an
# ARCHIVED pass saying "nothing new" where before the same answer would have
# been "none anchored" and an error, and `urn:repo:{repo}:findings:{path}`
# gained `summary=declined`, which widens its json face from the rows array to
# an object carrying the file-grain count of declines by quote — all
# observable, all additive, none of it a patch. The default json face of the
# findings listing is byte-identical without the argument, deliberately: gonk
# reads it as an array. gonk pins `"0.8.0"` and `^0.8.0` is `<0.9.0`, so it
# cannot see any of this until its pin moves — the hub's wave, as for every
# minor before it — and the mark is what its queue row should render next
# (the exact field names are in the release report). ⚠ The withhold rule was
# measured on the 458 declines on file before it shipped: 98 pairs shared a
# line, 78 shared a severity, NONE shared a byte-identical note — so it fires
# seldom by construction, and the mark carries the weight. Declines on other
# files are not consulted (the cross-file recurrence is a knowledge gap in the
# model, which the file-grain count makes visible and no key could fix). One
# vocabulary need REPORTED, not invented: a dedicated `ik:priorDecision` in
# place of the generic PROV influence. The `ikigai-vocab` dev-dependency floor
# moves to 0.1.71, where `ik:suppressedItems` landed.
#
# 0.10.0 — MINOR: A DECLINE SAYS WHY IN ONE WORD, AND THE WORD IS THE CONTRACT'S.
# Only 14 of 458 declines on file carried a reason, so 0.9.0's mark showed a
# date and nothing else on 97% of rows. The finding Sink gains an optional
# `reason` input whose `one_of` is five words in picker order — `misread`,
# `restates`, `no-issue`, `wont-fix`, `duplicate` — declared beside
# `SEVERITIES` (`finding::DECLINE_REASONS`, meanings in the ArgSpec summary),
# because gonk never spells a word a contract owns and reads its menus from
# the Meta face. A word beside `decision=publish` is refused BY NAME, a word
# outside the set is refused naming the set, and omitted stays valid (an
# empty value is omitted, so a form's unselected picker is never refused).
# Stored as a TERM on the decision node — `dcterms:subject
# <urn:iki:decline-reason:{word}>`, an interim predicate (not `dcterms:type`,
# which carries the outcome); `ik:declineReason` is REPORTED for core's vocab
# batch, not invented. Read back exactly: an unknown term is `reason: null`.
# ★ Why a minor: a new argument on a public Sink, a new `reason` field on the
# json `decision` and `prior_decision` objects, words on the plain and html
# faces, a reason picker on browse's own decision form, and a `reasons` list
# in `summary=declined` — all observable, all additive. A repeat that states a
# DIFFERENT reason than the one on file is now refused (by `reason`), which is
# the record rule applied to a new field, not a behaviour change for any call
# a 0.9.0 caller could make. gonk pins `"0.9.0"` and `^0.9.0` is `<0.10.0`, so
# it sees none of this until the hub moves its pin — and the picker is gonk's
# follow-up, reading `reason`'s `one_of` from the contract.
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-browse"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module", "capability"]
categories = ["development-tools", "filesystem"]

[features]
# The one-shot store migration (`migrate-annotation-ns`). It is the ONLY thing
# in this crate that opens a store on DISK, and RocksDB is what the host's
# persistent store is — so the binary, and only the binary, needs oxigraph's
# `rocksdb` feature and the C++ toolchain that comes with it. The library's
# `migrate` module is feature-free and tested against the in-memory store, so
# ordinary CI proves the transform without ever building RocksDB.
migrate = ["oxigraph/rocksdb"]

# The migration binary is gated: a default `cargo build` of this crate must
# stay pure-Rust (the same reason syntect uses fancy-regex and the hash is
# sha2 rather than blake3). Build it with:
#     cargo build --release --features migrate --bin migrate-annotation-ns
[[bin]]
name = "migrate-annotation-ns"
path = "src/bin/migrate-annotation-ns.rs"
required-features = ["migrate"]

# The cross-store move: a browse archive from one host's store into another's,
# renaming repository roots on the way. Same gate and the same reason — it is
# the second thing in this crate that opens a store on DISK. Build it with:
#     cargo build --release --features migrate --bin migrate-archive-roots
[[bin]]
name = "migrate-archive-roots"
path = "src/bin/migrate-archive-roots.rs"
required-features = ["migrate"]

# The rehearsal fixture: a throwaway on-disk store in the PRE-0.3.0 shape, so
# the migration can be run end-to-end against real RocksDB before it is run
# against the real store. Same gate, same reason.
[[example]]
name = "migration-rehearsal"
path = "examples/migration-rehearsal.rs"
required-features = ["migrate"]

# The cross-store rehearsal: run the root migration into a throwaway RocksDB
# store and then READ every entry it carried, with no LLM bound — so an archive
# miss cannot derive a replacement and look like success. Same gate, same
# reason.
[[example]]
name = "root-migration-rehearsal"
path = "examples/root-migration-rehearsal.rs"
required-features = ["migrate"]

[dependencies]
# The released kernel, consumed from crates.io. 0.1.54 is the true minimum:
# the manifold contract this crate now tests against (per-root rows surviving
# `describe_entry`'s probe-expansion, `Kernel::select_actions` + `ActionQuery`)
# shipped there; the capability baseline (declared `requires` = enforced,
# 0.1.49) rides along.
# NATIVE-ONLY: it reads the filesystem directly and spawns `git` (std::process)
# — the platform seam, like ikigai-repo. No wasm face by design.
#
# 0.1.56 is the pin because `ikigai-a11y` (below) requires it for `config::
# config_home` / `layered_paths_in`. Cargo would unify to it regardless, but a
# pin naming a version this crate's dependency graph cannot actually satisfy
# describes a build nobody has: state the real floor.
ikigai-core = "0.1.56"
# The accessibility config and the contrast-floor pass: `urn:repo:style`'s
# themes and its contrast floor are read from the layered `a11y.toml` rather
# than hard-coded, and each theme's own sub-floor colours are lifted to that
# theme's own default foreground. `features = ["themes"]` is the syntect/two-face
# bridge (name → embedded theme); the crate's default build is wasm-clean
# without it.
ikigai-a11y = { version = "0.2.1", features = ["themes"] }
# Syntax highlighting for the file HTML face. The pure-Rust regex engine
# (default-fancy) so CI never needs a C toolchain for oniguruma; yaml-load
# compiles the embedded Turtle .sublime-syntax (assets/) at first use.
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "yaml-load"] }
# The extended syntax + theme sets (S3): ~100 formats the stock syntect set
# misses (TOML, TypeScript, Dockerfile, …). syntect-fancy keeps the pure-Rust
# posture — it drops the handful of definitions fancy-regex cannot compile
# rather than pulling in oniguruma.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# The `as=application/json` face of urn:repo:{repo}:state (correct escaping of
# arbitrary dirty-file paths).
serde_json = "1"
# The content hash behind urn:repo:{repo}:hash:{path} and the explanation
# archive key. sha2 over blake3 because it is pure Rust — CI never needs a C
# toolchain (the same reason S0 picked syntect's fancy-regex engine).
sha2 = "0.10"
# The explanation ARCHIVE (S1): derived-once explanations persist as RDF in an
# Oxigraph store whose handle the host injects (one shared store — S2's
# annotations join it). default-features = false: in-memory engine, no RocksDB
# C++ build; a host wanting persistence enables oxigraph's storage features
# itself (feature unification makes the injected handle just work).
# NOTE: the brief named `ikigai-store`, but that crate is unpublished (checked
# crates.io 2026-08-08) and `ikigai-sparql` does not expose a shared-store
# handle — so the config takes Arc<oxigraph::store::Store> directly.
oxigraph = { version = "0.5", default-features = false }
# async trait objects for the explain endpoint (it must await sub-requests —
# FnEndpoint is sync-only), matching ikigai-core's own endpoint plumbing.
async-trait = "0.1"
# Minted annotation ids (S2): a Sink of the bare urn:iki:annotation creates the
# annotation under a fresh v4 uuid.
uuid = { version = "1", features = ["v4"] }
# The watch over the config home (`Mount::space_watched`): FSEvents / inotify
# on the directory the `a11y.toml` layers live in, cutting `urn:repo:style`'s
# golden threads by name when one is edited or created. The same watcher the
# embedded host uses for its workspace, at the same major, so a host linking
# both builds one copy. Native by construction, like the rest of this crate.
notify = "6.1"

[dev-dependencies]
# The module recipe as one test (`tests/conformance.rs`): the suite walks every
# endpoint this crate binds and reports every violation of the recipe at once.
# 0.2.0 is a FLOOR, not just what resolves: `Suite::opt_out_check` arrived in it,
# and `tests/conformance.rs` needs it. The 0.1.1 OUTPUTS check this pin's previous
# comment anticipated did land, did report `browse-file`'s pass-through raw face,
# and is waived per-rule there — with the whole endpoint still under the other
# nine checks, which is exactly what only 0.2.0 can express.
ikigai-conformance = "0.2.0"
# A FLOOR DECLARATION, not a code dependency: no line in this crate calls it.
# The suite's `VOCABULARY` check reads `ikigai_vocab::VOCABULARY` as its oracle,
# and the suite's own pin (`^0.1.66`) is the floor for the SUITE's API, not for
# this module's terms. The review face uses `ik:Review`, `ik:orphanedItems`,
# `ik:reviewedBytes` and `ik:totalBytes`, which landed in 0.1.69, and
# `ik:suppressedItems`, which landed in **0.1.71** — below it
# `tests/conformance.rs` goes red with an "invented term" finding that is
# really "the registry index is stale". Cargo unifies to the greater of the two
# requirements, so saying it here raises the floor without touching the suite.
# Dev-dependencies do not propagate, so no consumer of this crate pays for it.
ikigai-vocab = "0.1.71"
futures = "0.3"
# Validates the Turtle face in tests — the graph must actually parse.
oxttl = "0.2"
# The real-model demo (examples/explain-demo.rs) and the identity tests: mounts
# the actual LLM module so `cargo run --example explain-demo` derives genuine
# explanations against local Ollama models, and the tests exercise version-tag
# resolution against real endpoints. 0.10 introduced urn:llm:{provider}:model,
# the identity resource the tags fold; **0.12 is the true minimum now**, on two
# counts the option menu is written against: `urn:llm:models` reports a
# provider whose model is not pinned as a null `model` rather than omitting it
# (a provider may name only its server and discover what it serves), which is
# exactly the "unknown model" row the menu must not collapse; and the inventory
# is cacheable only while no provider is discovering, which is what makes
# opening a menu one sub-request instead of one probe per backend. A caret pin
# on "0.10" would let CI resolve a registry index where neither holds.
ikigai-llm = "0.12"
ikigai-http = "0.1.7"
ureq = "2"
