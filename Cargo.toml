[package]
name = "ikigai-browse"
description = "Repository browsing as ikigai resources: per-root tree / file / git-state endpoints (urn:repo:{repo}:tree | :file | :state), capability-gated, with text, htmx-HTML, and Turtle faces."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-browse"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module", "capability"]
categories = ["development-tools", "filesystem"]

[dependencies]
# The released kernel, consumed from crates.io. 0.1.49 is the true minimum:
# this module's capability contract (declared `requires` = enforced) leans on
# the kernel's baseline check landing before dispatch, which shipped in 0.1.49.
# NATIVE-ONLY: it reads the filesystem directly and spawns `git` (std::process)
# — the platform seam, like ikigai-repo. No wasm face by design.
ikigai-core = "0.1.49"
# Syntax highlighting for the file HTML face. The pure-Rust regex engine
# (default-fancy) so CI never needs a C toolchain for oniguruma.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# The `as=application/json` face of urn:repo:{repo}:state (correct escaping of
# arbitrary dirty-file paths).
serde_json = "1"

[dev-dependencies]
futures = "0.3"
# Validates the Turtle face in tests — the graph must actually parse.
oxttl = "0.2"
