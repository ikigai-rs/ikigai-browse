[package]
name = "ikigai-browse"
description = "Repository browsing as ikigai resources: per-root tree / file / git-state / hash endpoints, an archived LLM explanation layer, W3C Web Annotations that re-anchor under drift, a machine review pass that mints its findings as provenance-distinguished annotations, and a pull-request family (listing, annotatable diff pages, head-commit-keyed explains and reviews) - capability-gated, with text, htmx-HTML, and Turtle faces."
# 0.3.0 — MINOR, and deliberately not a patch: the annotation namespace moved
# from `urn:annotation:` to `urn:iki:annotation:` (the `urn:iki:` migration).
# A module crate's RESOURCE NAMES are its public interface even when its Rust
# API is untouched, so a patch would be picked up by a bare `cargo update` and
# take the old names out from under a host that had not installed an alias.
# The minor bump forces the manifest edit the host's alias rule must ride in:
#     prefix urn:annotation:  urn:iki:annotation:
#     exact  urn:annotation   urn:iki:annotation      # the bare minting IRI
# — BOTH rules; a prefix rule alone does not match the bare `urn:annotation`.
#
# 0.3.1 — PATCH, and deliberately not a minor: it adds the one-shot that moves
# an EXISTING store's annotations into the new namespace (the `migrate` module,
# the gated `migrate-annotation-ns` binary, the rehearsal example). Purely
# additive — no resource name, capability, face or host-facing signature moves,
# and a host that never runs the tool cannot tell 0.3.1 from 0.3.0. The alias
# rule above is what 0.3.0 asked hosts for; this is what it forgot to give them,
# because an alias rewrites incoming NAMES and does nothing to stored data.
#
# 0.3.2 — PATCH, additive: `Mount::space_watched` returns the space AND a
# `StyleWatch`, the watch over the config home that cuts `urn:repo:style`'s
# golden threads when an `a11y.toml` layer is edited or created. `Mount::space`
# is unchanged (it is `space_watched` with the watch dropped), no resource name,
# capability or face moves, and a host that keeps calling `space` keeps the
# behaviour it had — an edit lands at the next restart instead of the next read.
#
# 0.3.2 also adopts `ikigai-conformance` (`tests/conformance.rs`, 40 findings to
# 0). Everything that moved is ADDITIVE to the manifold and invisible to a Rust
# caller: every untyped input gained a `class`, three `as` inputs gained the
# `text/plain` their own `default_value` already named (the enum omitted the
# default), and the annotation Sink DECLARES the `content` it has read as the
# piped form of `body` since the family shipped. A consumer reading the manifold
# sees a truer contract; none sees a narrower one.
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-browse"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module", "capability"]
categories = ["development-tools", "filesystem"]

[features]
# The one-shot store migration (`migrate-annotation-ns`). It is the ONLY thing
# in this crate that opens a store on DISK, and RocksDB is what the host's
# persistent store is — so the binary, and only the binary, needs oxigraph's
# `rocksdb` feature and the C++ toolchain that comes with it. The library's
# `migrate` module is feature-free and tested against the in-memory store, so
# ordinary CI proves the transform without ever building RocksDB.
migrate = ["oxigraph/rocksdb"]

# The migration binary is gated: a default `cargo build` of this crate must
# stay pure-Rust (the same reason syntect uses fancy-regex and the hash is
# sha2 rather than blake3). Build it with:
#     cargo build --release --features migrate --bin migrate-annotation-ns
[[bin]]
name = "migrate-annotation-ns"
path = "src/bin/migrate-annotation-ns.rs"
required-features = ["migrate"]

# The rehearsal fixture: a throwaway on-disk store in the PRE-0.3.0 shape, so
# the migration can be run end-to-end against real RocksDB before it is run
# against the real store. Same gate, same reason.
[[example]]
name = "migration-rehearsal"
path = "examples/migration-rehearsal.rs"
required-features = ["migrate"]

[dependencies]
# The released kernel, consumed from crates.io. 0.1.54 is the true minimum:
# the manifold contract this crate now tests against (per-root rows surviving
# `describe_entry`'s probe-expansion, `Kernel::select_actions` + `ActionQuery`)
# shipped there; the capability baseline (declared `requires` = enforced,
# 0.1.49) rides along.
# NATIVE-ONLY: it reads the filesystem directly and spawns `git` (std::process)
# — the platform seam, like ikigai-repo. No wasm face by design.
#
# 0.1.56 is the pin because `ikigai-a11y` (below) requires it for `config::
# config_home` / `layered_paths_in`. Cargo would unify to it regardless, but a
# pin naming a version this crate's dependency graph cannot actually satisfy
# describes a build nobody has: state the real floor.
ikigai-core = "0.1.56"
# The accessibility config and the contrast-floor pass: `urn:repo:style`'s
# themes and its contrast floor are read from the layered `a11y.toml` rather
# than hard-coded, and each theme's own sub-floor colours are lifted to that
# theme's own default foreground. `features = ["themes"]` is the syntect/two-face
# bridge (name → embedded theme); the crate's default build is wasm-clean
# without it.
ikigai-a11y = { version = "0.2.1", features = ["themes"] }
# Syntax highlighting for the file HTML face. The pure-Rust regex engine
# (default-fancy) so CI never needs a C toolchain for oniguruma; yaml-load
# compiles the embedded Turtle .sublime-syntax (assets/) at first use.
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "yaml-load"] }
# The extended syntax + theme sets (S3): ~100 formats the stock syntect set
# misses (TOML, TypeScript, Dockerfile, …). syntect-fancy keeps the pure-Rust
# posture — it drops the handful of definitions fancy-regex cannot compile
# rather than pulling in oniguruma.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# The `as=application/json` face of urn:repo:{repo}:state (correct escaping of
# arbitrary dirty-file paths).
serde_json = "1"
# The content hash behind urn:repo:{repo}:hash:{path} and the explanation
# archive key. sha2 over blake3 because it is pure Rust — CI never needs a C
# toolchain (the same reason S0 picked syntect's fancy-regex engine).
sha2 = "0.10"
# The explanation ARCHIVE (S1): derived-once explanations persist as RDF in an
# Oxigraph store whose handle the host injects (one shared store — S2's
# annotations join it). default-features = false: in-memory engine, no RocksDB
# C++ build; a host wanting persistence enables oxigraph's storage features
# itself (feature unification makes the injected handle just work).
# NOTE: the brief named `ikigai-store`, but that crate is unpublished (checked
# crates.io 2026-08-08) and `ikigai-sparql` does not expose a shared-store
# handle — so the config takes Arc<oxigraph::store::Store> directly.
oxigraph = { version = "0.5", default-features = false }
# async trait objects for the explain endpoint (it must await sub-requests —
# FnEndpoint is sync-only), matching ikigai-core's own endpoint plumbing.
async-trait = "0.1"
# Minted annotation ids (S2): a Sink of the bare urn:iki:annotation creates the
# annotation under a fresh v4 uuid.
uuid = { version = "1", features = ["v4"] }
# The watch over the config home (`Mount::space_watched`): FSEvents / inotify
# on the directory the `a11y.toml` layers live in, cutting `urn:repo:style`'s
# golden threads by name when one is edited or created. The same watcher the
# embedded host uses for its workspace, at the same major, so a host linking
# both builds one copy. Native by construction, like the rest of this crate.
notify = "6.1"

[dev-dependencies]
# The module recipe as one test (`tests/conformance.rs`): the suite walks every
# endpoint this crate binds and reports every violation of the recipe at once.
# 0.1.0 is what crates.io holds; the caret is deliberate — 0.1.1 adds an OUTPUTS
# check this crate's by-hand `declared_outputs_are_the_media_types_served`
# anticipates, and the day it publishes the walk should pick it up.
ikigai-conformance = "0.1.0"
futures = "0.3"
# Validates the Turtle face in tests — the graph must actually parse.
oxttl = "0.2"
# The real-model demo (examples/explain-demo.rs) and the identity tests: mounts
# the actual LLM module so `cargo run --example explain-demo` derives genuine
# explanations against local Ollama models, and the tests exercise version-tag
# resolution against real endpoints. 0.10 introduced urn:llm:{provider}:model,
# the identity resource the tags fold; **0.12 is the true minimum now**, on two
# counts the option menu is written against: `urn:llm:models` reports a
# provider whose model is not pinned as a null `model` rather than omitting it
# (a provider may name only its server and discover what it serves), which is
# exactly the "unknown model" row the menu must not collapse; and the inventory
# is cacheable only while no provider is discovering, which is what makes
# opening a menu one sub-request instead of one probe per backend. A caret pin
# on "0.10" would let CI resolve a registry index where neither holds.
ikigai-llm = "0.12"
ikigai-http = "0.1.7"
ureq = "2"
